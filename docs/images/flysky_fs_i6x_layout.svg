<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .case { fill: #1e293b; stroke: #0f172a; stroke-width: 3; }
      .case-inner { fill: #334155; stroke: #475569; stroke-width: 1.5; }
      .gimbal-base { fill: #0f172a; stroke: #475569; stroke-width: 2; }
      .gimbal-ring { fill: #1e293b; stroke: #64748b; stroke-width: 1.5; }
      .stick { fill: #38bdf8; stroke: #0284c7; stroke-width: 2; }
      .screen { fill: #064e3b; stroke: #047857; stroke-width: 2; }
      .screen-text { fill: #a7f3d0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 13px; font-weight: bold; }
      .knob { fill: #475569; stroke: #94a3b8; stroke-width: 2; }
      .knob-notch { stroke: #f8fafc; stroke-width: 2.5; stroke-linecap: round; }
      .switch-base { fill: #64748b; stroke: #94a3b8; stroke-width: 1.5; }
      .switch-lever { stroke: #cbd5e1; stroke-width: 4; stroke-linecap: round; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06)); }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 800; fill: #0f172a; }
      .card-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #2563eb; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; }
      .card-alert { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #dc2626; }
      .pointer { stroke: #2563eb; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .pointer-dot { fill: #2563eb; }
      .title-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #0f172a; }
      .title-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
    </style>
    <marker id="dot" viewBox="0 0 8 8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" class="bg" />

  <!-- Header -->
  <text x="500" y="32" text-anchor="middle" class="title-main">FlySky FS-i6X Transmitter — R2-D2 Control Map</text>
  <text x="500" y="52" text-anchor="middle" class="title-sub">10-Channel 2.4GHz AFHDS 2A Transmitter • On-Board Proportional Mixing</text>

  <!-- TRANSMITTER BODY -->
  <g id="controller" transform="translate(140, 20)">
    <!-- Antenna & Handle -->
    <rect x="335" y="45" width="50" height="50" rx="6" fill="#0f172a" />
    <path d="M 280 85 L 280 50 Q 280 40 295 40 L 425 40 Q 440 40 440 50 L 440 85 Z" fill="none" stroke="#0f172a" stroke-width="14" stroke-linejoin="round" />

    <!-- Main Shell Outer Contour -->
    <path d="M 230 90 
             L 290 85 Q 360 82 430 85 L 490 90 
             Q 525 95 535 125 
             L 545 220 Q 550 250 535 280
             L 530 460 Q 525 500 480 515
             L 240 515 Q 195 500 190 460
             L 185 280 Q 170 250 175 220
             L 185 125 Q 195 95 230 90 Z" class="case" />

    <!-- Shell Grip Insets -->
    <path d="M 178 240 Q 190 320 185 420" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
    <path d="M 542 240 Q 530 320 535 420" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />

    <!-- Top Bezel / Brand Pod -->
    <path d="M 290 85 L 430 85 L 440 160 L 280 160 Z" class="case-inner" />
    <rect x="315" y="125" width="90" height="26" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="360" y="142" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="900" letter-spacing="1.5">FLYSKY</text>

    <!-- Top Center Dials: VrA and VrB -->
    <!-- VrA (Left Dial) -->
    <circle cx="320" cy="105" r="18" class="knob" id="knob-vra" />
    <circle cx="320" cy="105" r="13" fill="#1e293b" />
    <line x1="320" y1="95" x2="320" y2="105" class="knob-notch" />
    <text x="320" y="80" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="bold">VrA</text>

    <!-- VrB (Right Dial) -->
    <circle cx="400" cy="105" r="18" class="knob" id="knob-vrb" />
    <circle cx="400" cy="105" r="13" fill="#1e293b" />
    <line x1="400" y1="95" x2="400" y2="105" class="knob-notch" />
    <text x="400" y="80" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="bold">VrB</text>

    <!-- Switches: Top Left (SwA outer, SwB inner) -->
    <!-- SwA: Far Left Toggle (2-pos) -->
    <circle cx="218" cy="120" r="10" class="switch-base" id="sw-swa" />
    <line x1="218" y1="120" x2="218" y2="102" class="switch-lever" />
    <text x="218" y="140" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="9" font-weight="bold">SwA</text>

    <!-- SwB: Inner Left Toggle (3-pos) -->
    <circle cx="258" cy="115" r="10" class="switch-base" id="sw-swb" />
    <line x1="258" y1="115" x2="258" y2="97" class="switch-lever" />
    <text x="258" y="135" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="9" font-weight="bold">SwB</text>

    <!-- Switches: Top Right (SwC inner, SwD outer) -->
    <!-- SwC: Inner Right Toggle (3-pos) -->
    <circle cx="462" cy="115" r="10" class="switch-base" id="sw-swc" />
    <line x1="462" y1="115" x2="462" y2="97" class="switch-lever" />
    <text x="462" y="135" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="9" font-weight="bold">SwC</text>

    <!-- SwD: Far Right Toggle (2-pos) -->
    <circle cx="502" cy="120" r="10" class="switch-base" id="sw-swd" />
    <line x1="502" y1="120" x2="502" y2="102" class="switch-lever" />
    <text x="502" y="140" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="9" font-weight="bold">SwD</text>

    <!-- Left Gimbal (Dome Rotation) -->
    <g id="gimbal-left" transform="translate(255, 230)">
      <rect x="-55" y="-55" width="110" height="110" rx="14" class="gimbal-base" />
      <circle cx="0" cy="0" r="44" class="gimbal-ring" />
      <circle cx="0" cy="0" r="28" fill="#0f172a" />
      <!-- Crosshairs -->
      <line x1="-38" y1="0" x2="38" y2="0" stroke="#475569" stroke-width="1.5" />
      <line x1="0" y1="-38" x2="0" y2="38" stroke="#475569" stroke-width="1.5" />
      <!-- Stick Head -->
      <circle cx="0" cy="0" r="14" class="stick" />
      <circle cx="0" cy="0" r="6" fill="#0369a1" />
      <!-- Digital Trims -->
      <rect x="-18" y="48" width="36" height="7" rx="2" fill="#334155" stroke="#64748b" />
      <rect x="48" y="-18" width="7" height="36" rx="2" fill="#334155" stroke="#64748b" />
    </g>

    <!-- Right Gimbal (Foot Drive) -->
    <g id="gimbal-right" transform="translate(465, 230)">
      <rect x="-55" y="-55" width="110" height="110" rx="14" class="gimbal-base" />
      <circle cx="0" cy="0" r="44" class="gimbal-ring" />
      <circle cx="0" cy="0" r="28" fill="#0f172a" />
      <!-- Crosshairs -->
      <line x1="-38" y1="0" x2="38" y2="0" stroke="#475569" stroke-width="1.5" />
      <line x1="0" y1="-38" x2="0" y2="38" stroke="#475569" stroke-width="1.5" />
      <!-- Stick Head -->
      <circle cx="0" cy="0" r="14" class="stick" />
      <circle cx="0" cy="0" r="6" fill="#0369a1" />
      <!-- Digital Trims -->
      <rect x="-18" y="48" width="36" height="7" rx="2" fill="#334155" stroke="#64748b" />
      <rect x="-55" y="-18" width="7" height="36" rx="2" fill="#334155" stroke="#64748b" />
    </g>

    <!-- Center Power Switch & Model Badge -->
    <rect x="343" y="195" width="34" height="52" rx="4" fill="#0f172a" stroke="#475569" />
    <rect x="349" y="215" width="22" height="18" rx="2" fill="#dc2626" />
    <text x="360" y="260" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="8" font-weight="bold">POWER</text>

    <!-- Bottom LCD Display Area -->
    <rect x="235" y="335" width="250" height="145" rx="8" class="case-inner" />
    <rect x="255" y="348" width="210" height="105" rx="4" class="screen" />
    <!-- Screen Contents -->
    <text x="265" y="370" class="screen-text">FLYSKY AFHDS-2A</text>
    <text x="265" y="390" class="screen-text">HDR2-D2 ACTIVE</text>
    <text x="265" y="410" class="screen-text">TX: 10.4V   SIG: 99%</text>
    <text x="265" y="435" class="screen-text">MODE: 2 (10 CH)</text>
    <!-- Buttons -->
    <rect x="238" y="365" width="12" height="14" rx="2" fill="#475569" />
    <rect x="238" y="395" width="12" height="14" rx="2" fill="#475569" />
    <rect x="470" y="365" width="12" height="14" rx="2" fill="#475569" />
    <rect x="470" y="395" width="12" height="14" rx="2" fill="#475569" />
    <rect x="470" y="425" width="12" height="14" rx="2" fill="#475569" />
  </g>

  <!-- ==================== CALLOUT CARDS & POINTERS ==================== -->

  <!-- Top-Left: SwA (Safety Arm) -->
  <g transform="translate(20, 75)">
    <rect width="260" height="85" class="card" />
    <text x="14" y="22" class="card-title">SwA • Drive Safety Arm</text>
    <text x="14" y="38" class="card-subtitle">Channel 6 • 2-Position Toggle (Outer)</text>
    <text x="14" y="55" class="card-body">▲ UP (≤1250µs): <tspan font-weight="bold" fill="#dc2626">DISARMED</tspan> (Safe state)</text>
    <text x="14" y="72" class="card-body">▼ DOWN (≥1750µs): <tspan font-weight="bold" fill="#16a34a">ARMED</tspan> (Drive enabled)</text>
    <text x="14" y="85" class="card-alert">Requires 500ms centered sticks to arm</text>
    <path d="M 260 42 L 358 140" class="pointer" marker-start="none" />
    <circle cx="358" cy="140" r="3.5" class="pointer-dot" />
  </g>

  <!-- Mid-Left: SwB (Speed Limit) -->
  <g transform="translate(20, 185)">
    <rect width="260" height="85" class="card" />
    <text x="14" y="22" class="card-title">SwB • Speed Rate Cap</text>
    <text x="14" y="38" class="card-subtitle">Channel 5 • 3-Position Toggle (Inner)</text>
    <text x="14" y="55" class="card-body">▲ UP (Pos 1): <tspan font-weight="bold">35% Speed</tspan> (Indoor / Safe)</text>
    <text x="14" y="69" class="card-body">■ MID (Pos 2): <tspan font-weight="bold">70% Speed</tspan> (Cruising)</text>
    <text x="14" y="83" class="card-body">▼ DOWN (Pos 3): <tspan font-weight="bold">95% Speed</tspan> (Full outdoor cap)</text>
    <path d="M 260 42 L 398 135" class="pointer" />
    <circle cx="398" cy="135" r="3.5" class="pointer-dot" />
  </g>

  <!-- Top Center-Left: VrA (Mood / Macro Dial) -->
  <g transform="translate(180, 5)">
    <rect width="250" height="75" class="card" />
    <text x="14" y="20" class="card-title">VrA • Mood &amp; Routine Dial</text>
    <text x="14" y="36" class="card-subtitle">Channel 7 • Top Left Rotary Knob</text>
    <text x="14" y="52" class="card-body">13 Discrete Positions (Full CCW to CW)</text>
    <text x="14" y="68" class="card-body">1: Home Dome • 4: Scream • 6: Leia</text>
    <path d="M 250 55 L 460 125" class="pointer" />
    <circle cx="460" cy="125" r="3.5" class="pointer-dot" />
  </g>

  <!-- Top Center-Right: VrB (Unused) -->
  <g transform="translate(570, 5)">
    <rect width="250" height="75" class="card" />
    <text x="14" y="20" class="card-title">VrB • Expansion Dial</text>
    <text x="14" y="36" class="card-subtitle">Channel 10 • Top Right Rotary Knob</text>
    <text x="14" y="52" class="card-body">Deliberately Unused in Firmware</text>
    <text x="14" y="68" class="card-body">Reserved for future expansion</text>
    <path d="M 0 55 L 540 125" class="pointer" />
    <circle cx="540" cy="125" r="3.5" class="pointer-dot" />
  </g>

  <!-- Top-Right: SwD (Auto Dome) -->
  <g transform="translate(720, 75)">
    <rect width="260" height="85" class="card" />
    <text x="14" y="22" class="card-title">SwD • Auto Dome Enable</text>
    <text x="14" y="38" class="card-subtitle">Channel 9 • 2-Position Toggle (Outer)</text>
    <text x="14" y="55" class="card-body">▲ UP (≤1250µs): <tspan font-weight="bold">OFF</tspan> (Manual only)</text>
    <text x="14" y="72" class="card-body">▼ DOWN (≥1750µs): <tspan font-weight="bold" fill="#16a34a">AUTO ON</tspan></text>
    <text x="14" y="85" class="card-body">Wanders after 20s idle; stick overrides</text>
    <path d="M 0 42 L 642 140" class="pointer" />
    <circle cx="642" cy="140" r="3.5" class="pointer-dot" />
  </g>

  <!-- Mid-Right: SwC (Macro Trigger) -->
  <g transform="translate(720, 185)">
    <rect width="260" height="85" class="card" />
    <text x="14" y="22" class="card-title">SwC • Macro Fire Trigger</text>
    <text x="14" y="38" class="card-subtitle">Channel 8 • 3-Position Toggle (Inner)</text>
    <text x="14" y="55" class="card-body">▲ UP / MID: <tspan font-weight="bold">Idle / Ready</tspan></text>
    <text x="14" y="72" class="card-body">▼ DOWN (&gt;1750µs): <tspan font-weight="bold" fill="#2563eb">FIRE ROUTINE</tspan></text>
    <text x="14" y="85" class="card-body">Executes action selected on VrA</text>
    <path d="M 0 42 L 602 135" class="pointer" />
    <circle cx="602" cy="135" r="3.5" class="pointer-dot" />
  </g>

  <!-- Lower Left: Dome Rotation Stick -->
  <g transform="translate(20, 370)">
    <rect width="280" height="105" class="card" />
    <text x="14" y="22" class="card-title">Left Joystick • Dome Rotation</text>
    <text x="14" y="38" class="card-subtitle">Channel 4 (Horizontal Axis)</text>
    <text x="14" y="56" class="card-body">◄ PUSH LEFT: Spin Counter-Clockwise (CCW)</text>
    <text x="14" y="72" class="card-body">► PUSH RIGHT: Spin Clockwise (CW)</text>
    <text x="14" y="88" class="card-body">■ CENTER: Immediate Stop (1500µs neutral)</text>
    <text x="14" y="101" class="card-body">Vertical axis (CH3) is unused (manual tilt retired)</text>
    <path d="M 280 50 L 395 250" class="pointer" />
    <circle cx="395" cy="250" r="4" class="pointer-dot" />
  </g>

  <!-- Lower Right: Foot Drive Stick -->
  <g transform="translate(700, 370)">
    <rect width="280" height="105" class="card" />
    <text x="14" y="22" class="card-title">Right Joystick • Foot Drive &amp; Steer</text>
    <text x="14" y="38" class="card-subtitle">Channel 1 (Steer) &amp; Channel 2 (Throttle)</text>
    <text x="14" y="56" class="card-body">▲ PUSH UP: Forward • ▼ PULL DOWN: Reverse</text>
    <text x="14" y="72" class="card-body">◄ LEFT / ► RIGHT: Proportional Differential Turn</text>
    <text x="14" y="88" class="card-body">■ CENTER: Active regenerative braking stops feet</text>
    <text x="14" y="101" class="card-body">50Hz on-board mixing preserves turning proportions</text>
    <path d="M 0 50 L 605 250" class="pointer" />
    <circle cx="605" cy="250" r="4" class="pointer-dot" />
  </g>

  <!-- Footer Banner -->
  <rect x="250" y="630" width="500" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="500" y="654" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">
    SAFETY FIRST: Start with all switches UP • Center sticks for 500ms after flipping SwA DOWN to arm
  </text>
</svg>
